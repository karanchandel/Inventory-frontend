<main class="max-w-md mx-auto mt-10 p-6 bg-white rounded shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">Forgot Password</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Email Field -->
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Please enter a valid email.
      </mat-error>
    </mat-form-field>

    <!-- Submit Button -->
    <button mat-raised-button color="primary" class="w-full" [disabled]="form.invalid">
      Send Reset Link
    </button>

    <!-- Back to Login -->
    <div class="text-center mt-4">
      <a routerLink="/auth/login" class="text-sm text-blue-600 hover:underline">
        Back to Login
      </a>
    </div>
  </form>
</main>
