<main class="max-w-md mx-auto mt-10 p-6 bg-white dark:bg-darkbg rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">Sign Up</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Confirm Password</mat-label>
      <input matInput formControlName="confirmPassword" type="password" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" class="w-full">Register</button>
  </form>

  <!-- Login Link -->
  <div class="text-center text-sm mt-6">
    <span class="text-gray-600 dark:text-gray-400">Already have an account?</span>
    <a routerLink="/auth/login" class="text-blue-600 hover:underline ml-1">
      Login
    </a>
  </div>
</main>
